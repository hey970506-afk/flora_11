<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="花序，一张安静、清楚的日常任务清单。离线使用，在当前浏览器中保存。">
<title>花序 · 任务清单</title>
<style>
/* 基础排版、清单、植物边饰、日期面板与动效；响应式规则保留原有优先顺序。 */
:root {
  --ink: #344238;
  --muted: #68705e;
  --green: #49624b;
  --gold: #ac8d55;
  --line: #d5ceb8;
  --paper: #f8f5e9;
  --red: #995642;
  --serif: "Songti SC","STSong","SimSun",serif;
  --sans: "Microsoft YaHei","PingFang SC",sans-serif;
  --ui: "DengXian","等线","PingFang SC","Microsoft YaHei",sans-serif;
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none!important;
}
body {
  margin: 0;
  padding: 0 30px 36px;
  color: var(--ink);
  background: #e6e8dc;
  font: 14px/1.65 var(--sans);
  background-image: radial-gradient(ellipse at 10% 0%,#f4f1df,transparent 60%);
}
button:focus-visible,
input:focus-visible {
  outline: 2px solid #92692e;
  outline-offset: 4px;
}
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  border-radius: 4px;
}
input {
  font: inherit;
  color: inherit;
  border-radius: 4px;
}
svg {
  display: block;
}
header {
  margin: auto;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  padding: 30px 5px 25px;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
}
.brand svg {
  width: 28px;
  height: 35px;
  color: var(--green);
}
.brand-name {
  font: 400 38px/1.2 "STFangsong","华文仿宋","FangSong","仿宋",var(--serif);
  letter-spacing: 4px;
  white-space: nowrap;
  color: var(--green);
}
.date {
  color: var(--muted);
  white-space: nowrap;
}
.sheet {
  position: relative;
  max-width: 1000px;
  margin: auto;
  background: var(--paper);
  border: 1px solid #c9b98f;
  box-shadow: 0 12px 38px #3442380a;
  min-height: 570px;
  padding: 38px 52px 28px;
  isolation: isolate;
}
.heading {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 24px;
}
h1 {
  font: 32px/1.3 var(--serif);
  letter-spacing: 3px;
  margin: 0;
  font-weight: 400;
}
.summary {
  margin: 0;
  text-align: right;
}
.overdue-summary {
  color: var(--red);
}
.warning {
  background: #f3e7cf;
  border-left: 2px solid #ad884d;
  color: #75582e;
  padding: 10px 13px;
  font-size: 12px;
  margin-bottom: 18px;
}
.composer {
  display: grid;
  grid-template-columns: minmax(0,1fr) 157px 108px;
  gap: 14px;
  align-items: end;
  padding-bottom: 8px;
}
.name-field {
  min-width: 0;
}
input[type=text] {
  width: 100%;
  display: block;
  min-height: 46px;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  padding: 9px 2px;
}
input::placeholder {
  color: #7c806c;
  font-size: 14px;
}
input[type=text]:focus {
  border-bottom-color: #a6af91;
}
.date-field {
  display: block;
  color: var(--muted);
}
.date-field span {
  display: block;
  margin-bottom: 3px;
}
.primary {
  border: 1px solid var(--green);
  background: var(--green);
  color: #fff9e8;
  min-height: 44px;
  padding: 9px 17px;
  font-size: 14px;
  box-shadow: inset 0 0 0 2px var(--green),inset 0 0 0 3px #b2ba9699;
}
.primary:hover {
  background: #39513d;
  box-shadow: inset 0 0 0 2px #39513d,inset 0 0 0 3px #b2ba9699;
}
.form-message {
  font-size: 12px;
  color: var(--muted);
}
.form-message.error {
  color: var(--red);
}
.list-tools {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 11px;
}
.text-button {
  background: transparent;
  border: 0;
  padding: 8px 0 8px 12px;
  color: var(--muted);
  font-size: 12px;
  min-height: 36px;
}
.text-button:hover {
  color: var(--green);
  text-decoration: underline;
}
.task-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.task {
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid #ddd7c4;
  padding: 15px 0;
  min-height: 76px;
}
.check-area {
  flex: 0 0 38px;
  min-height: 44px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.task input[type=checkbox] {
  appearance: none;
  border: 1px solid #819073;
  border-radius: 50% 50% 35% 35%;
  display: grid;
  place-content: center;
  background: #faf8ef;
  cursor: pointer;
}
.task-content {
  flex: 1;
  min-width: 0;
}
.task.done .task-title {
  color: #7a806d;
  text-decoration: line-through;
  text-decoration-color: #a6ac96;
}
.task-meta {
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}
.task-meta .overdue {
  color: var(--red);
}
.task-meta .today {
  color: #86672d;
}
.task-actions {
  display: flex;
  flex-shrink: 0;
  gap: 1px;
}
.row-action {
  background: none;
  border: 0;
  padding: 10px 8px;
  min-height: 44px;
  color: var(--muted);
  font-size: 12px;
}
.row-action:hover {
  color: var(--green);
  background: #e9ecd9aa;
}
.row-action.delete:hover {
  color: var(--red);
  background: #f1e4d9;
}
.empty {
  position: relative;
  text-align: center;
  padding: 42px 12px 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.empty-line {
  color: #89936a;
  width: 80px;
  height: 68px;
  opacity: .85;
  margin-bottom: 14px;
}
.empty h2 {
  font: 22px var(--serif);
  letter-spacing: 2px;
  font-weight: 400;
  margin: 0 0 9px;
  color: #57664c;
}
.empty p {
  font-size: 13px;
  color: var(--muted);
  margin: 0;
  max-width: 380px;
}
.undo-bar {
  position: fixed;
  bottom: 23px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  background: #f8f5e9;
  border: 1px solid var(--gold);
  box-shadow: 0 6px 24px #3043311c;
  color: var(--ink);
  padding: 9px 17px;
  display: flex;
  gap: 24px;
  align-items: center;
  font-size: 13px;
  max-width: calc(100% - 28px);
  width: max-content;
}
.undo-bar button {
  background: none;
  border: 0;
  color: var(--green);
  font-size: 13px;
  font-weight: 600;
  padding: 8px 4px;
  min-height: 40px;
  white-space: nowrap;
}
.undo-bar button:hover {
  text-decoration: underline;
}
dialog {
  padding: 29px 30px 26px;
  width: 440px;
  max-width: calc(100% - 30px);
  border: 1px solid var(--gold);
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 18px 70px #203a3430;
}
dialog::backdrop {
  background: #20362c66;
}
dialog h2 {
  font: 24px var(--serif);
  letter-spacing: 2px;
  font-weight: 400;
  margin: 0 0 20px;
}
.edit-label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-top: 15px;
}
.edit-label input[type=text] {
  border-bottom: 1px solid var(--line);
  margin-top: 5px;
}
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
}
.secondary {
  background: transparent;
  border: 1px solid var(--line);
  padding: 9px 18px;
  min-height: 44px;
}
.edit-error {
  color: var(--red);
  font-size: 12px;
  margin-top: 12px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.page-end {
  text-align: center;
  margin: 17px auto 0;
  color: #79846d;
  font-size: 11px;
  letter-spacing: 3px;
}
@media(max-width:760px) {
  body {
    padding: 0 15px 25px;
  }
  header {
    padding: 24px 3px 20px;
  }
  .brand-subtitle {
    display: none;
  }
  .brand-name {
    font-size: 34px;
  }
  .sheet {
    padding: 29px 25px 22px;
    min-height: 520px;
  }
  .heading {
    margin-bottom: 19px;
  }
  h1 {
    font-size: 28px;
  }
  .name-field {
    grid-column: 1/-1;
  }
  .date-field {
    max-width: 185px;
  }
  .date-field input {
    min-height: 42px;
  }
  .primary {
    min-height: 44px;
  }
  .task {
    gap: 4px;
    padding: 13px 0;
  }
  .check-area {
    flex-basis: 32px;
  }
  .task-actions {
    gap: 0;
  }
  .row-action {
    padding: 10px 7px;
  }
  .task-meta {
    font-size: 11px;
  }
  .empty h2 {
    font-size: 20px;
  }
  .empty p {
    font-size: 12px;
  }
  .page-end {
    font-size: 10px;
    letter-spacing: 2px;
  }
}
@media(max-width:400px) {
  body {
    padding: 0 10px 22px;
  }
  .sheet {
    padding: 26px 18px 20px;
  }
  .brand {
    gap: 7px;
  }
  .brand-name {
    font-size: 32px;
  }
  h1 {
    font-size: 25px;
  }
  .heading {
    align-items: center;
    gap: 8px;
  }
  .summary {
    max-width: 130px;
  }
  .task {
    flex-wrap: wrap;
  }
  .task-actions {
    margin-left: auto;
    margin-top: -6px;
  }
  .text-button {
    font-size: 11px;
  }
}
@media(prefers-reduced-motion:reduce) {
  * {
    scroll-behavior: auto!important;
  }
}
.sheet {
  padding-top: 54px;
}
.date {
  font-family: "STSong","华文宋体","SimSun","Songti SC",serif;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1.2px;
}
.empty p {
  text-align: center;
}
@media(max-width:760px) {
  .sheet {
    padding-top: 50px;
  }
  .date {
    font-size: 13px;
    letter-spacing: 1px;
  }
}
@media(max-width:400px) {
  .sheet {
    padding-top: 48px;
  }
  .date {
    font-size: 12px;
    letter-spacing: .5px;
  }
}
.garden-layout .sheet {
  min-width: 0;
}
.date-control,
.date-field .date-control {
  display: block;
  position: relative;
  width: 100%;
  min-width: 0;
  margin: 0;
}
.date-display,
.date-field .date-display {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);
  align-items: center;
  gap: 2px;
  padding: 0 30px 0 7px;
  margin: 0;
  pointer-events: none;
  color: #7b806e;
  font: 13px/1 "STSong","SimSun",serif;
  font-variant-numeric: tabular-nums;
  z-index: 2;
}
.date-display.has-value {
  color: var(--ink);
}
.date-display span {
  display: block;
  margin: 0;
  min-width: 0;
  text-align: center;
  letter-spacing: 0;
}
.date-display i {
  font-style: normal;
  font-size: 11px;
  color: #93927d;
}
.edit-label .date-control {
  max-width: 195px;
  margin-top: 7px;
}
@media(max-width:1100px) {
  .garden-layout .sheet {
    padding-left: 36px;
    padding-right: 36px;
  }
  .composer {
    grid-template-columns: minmax(0,1fr) 148px 104px;
    gap: 10px;
  }
}
@media(max-width:760px) {
  .garden-layout .sheet {
    padding-left: 25px;
    padding-right: 25px;
  }
  .composer {
    grid-template-columns: minmax(0,1fr) 105px;
    gap: 11px;
  }
}
@media(max-width:420px) {
  .garden-layout .sheet {
    padding-left: 18px;
    padding-right: 18px;
  }
}
.garden-layout {
  position: relative;
  display: block;
  max-width: 1190px;
  margin: 0 auto;
  padding: 70px 145px 72px;
  isolation: isolate;
}
.garden-layout .sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 860px;
  margin: 0 auto;
  padding: 34px 38px 28px;
  min-height: 510px;
}
header,
.page-end {
  max-width: 860px;
}
header {
  width: 100%;
}
.frame-outline {
  position: absolute;
  inset: 29.33px;
  border: 1.5px solid #819064;
  border-radius: 48px 10px 48px 10px;
  pointer-events: none;
  z-index: -1;
}
.frame-corner {
  position: absolute;
  width: 220px;
  height: 220px;
  color: #6d7e53;
  pointer-events: none;
  z-index: 0;
}
.frame-corner.tl {
  left: 0;
  top: 0;
}
.frame-corner.tr {
  right: 0;
  top: 0;
  transform: rotate(90deg);
}
.frame-corner.br {
  right: 0;
  bottom: 0;
  transform: rotate(180deg);
}
.frame-corner.bl {
  left: 0;
  bottom: 0;
  transform: rotate(-90deg);
}
.list-tools {
  min-height: 0;
  margin: 0;
  padding: 5px 0 0;
  align-items: flex-start;
  gap: 10px;
}
.sort-note {
  font-size: 11px;
  line-height: 20px;
  margin: 0;
  padding: 0;
}
.list-tools .text-button {
  font-size: 11px;
  line-height: 20px;
  min-height: 24px;
  padding: 0 0 4px 10px;
}
.form-message {
  min-height: 0;
  margin: 5px 0 7px;
  line-height: 1.7;
}
.form-message:empty {
  display: none;
}
.form-message:not(.error) {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  white-space: nowrap;
  border: 0;
}
.empty {
  min-height: 260px;
  padding-top: 35px;
  padding-bottom: 35px;
}
.task-list {
  margin-top: 8px;
}
@media(max-width:1100px) {
  header {
    width: calc(100% - 130px);
  }
  .garden-layout {
    padding: 62px 65px 64px;
  }
  .garden-layout .sheet {
    padding: 34px 32px 28px;
  }
  .frame-corner {
    width: 178px;
    height: 178px;
  }
  .frame-outline {
    inset: 23.73px;
  }
}
@media(max-width:760px) {
  header {
    width: calc(100% - 56px);
  }
  .garden-layout {
    padding: 56px 28px 58px;
  }
  .garden-layout .sheet {
    padding: 29px 24px 24px;

  }

    width: 138px;

  }
  .frame-outline {
    inset: 18.4px;

  }
  .empty {
    min-height: 238px;
    padding: 31px 2px;
  }
  .sort-note {
    font-size: 10px;
  }
  .task-list {
    margin-top: 6px;
  }
}
@media(max-width:420px) {
  header {
    width: calc(100% - 36px);
  }
  .garden-layout {
    padding: 52px 18px 54px;
  }
  .garden-layout .sheet {
    padding: 26px 17px 23px;
  }
  .frame-corner {
    width: 120px;
    height: 120px;
  }
  .frame-outline {
    inset: 16px;
  }
  .sort-note {
    font-size: 10px;
  }
  .list-tools .text-button {
    font-size: 10px;
    padding-left: 4px;
  }
}
@media(max-width:380px) {
  .composer {
    grid-template-columns: minmax(0,1fr);
    gap: 10px;
  }
  .composer .name-field {
    grid-column: auto;
  }
  .composer .date-field {
    max-width: none;
  }
  .composer .primary {
    width: 100%;
  }
  .heading {
    flex-wrap: wrap;
    gap: 6px;
  }
  .heading .summary {
    max-width: none;
    width: 100%;
    text-align: left;
  }
  .list-tools {
    flex-wrap: wrap;
    gap: 2px;
  }
  .list-tools .text-button {
    padding-left: 0;
  }
  .undo-bar {
    gap: 12px;
  }
}
input[type=text] {
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.7;
  letter-spacing: .035em;
}
input[type=text]:focus,
input[type=text]:focus-visible {
  outline: none;
  box-shadow: none;
}
#task-name,
#task-name:focus,
#task-name:focus-visible {
  border-bottom-color: transparent;
}
input[type=text]::placeholder {
  font-family: var(--serif);
  font-size: 16px;
  letter-spacing: .05em;
}
.task-title {
  overflow-wrap: anywhere;
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 400;
  line-height: 1.75;
  letter-spacing: .025em;
}
.task-meta,
.task .row-action,
.sort-note,
.date-field,
.edit-label,
.list-tools .text-button,
.primary,
.secondary {
  font-family: var(--ui);
  letter-spacing: .025em;
}
.summary {
  color: #53624f;
  font-variant-numeric: tabular-nums;
}
.date-field {
  font-size: 12px;
  font-weight: 400;
}
.sort-note {
  font-weight: 400;
}
.primary {
  font-weight: 600;
}
.composer {
  border-bottom: 2px solid #87936e;
}
.garden-layout .sheet {
  border-color: #b3a37f;
}
.frame-outline {

}
.task {

    font-size: 11px;

}

}
.composer {

}
.task {
  border-bottom-width: 2px;
}
.task input[type=checkbox],

.secondary,

.frame-corner>g {

}
.date-trigger {
  position: relative;
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 8px 30px 8px 8px;

}
.date-trigger:hover,
.date-trigger[aria-expanded=true] {
  border-color: #7d8e64;

}
.date-trigger:focus-visible {

}
.date-trigger .date-display {

}
.date-icon {

  height: 18px;

}
.calendar {
  position: fixed;
  z-index: 50;
  width: 304px;
  max-width: calc(100vw - 24px);
  max-height: calc(100dvh - 24px);
  overflow: auto;
  margin: 0;
  padding: 18px;
  background: #f8f5e9;
  border: 2px solid #7f8d65;

  color: var(--ink);

}
.calendar button {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 3px;
  color: inherit;
}
.calendar button:hover {
  background: #e4e8d5;
}
.calendar button:focus-visible {
  outline: 2px solid #8d9b72;
  outline-offset: 1px;
}
.cal-head {
  display: grid;
  grid-template-columns: 30px 1fr 1fr 30px;
  gap: 3px;
  align-items: center;
  margin-bottom: 13px;
}
.cal-nav {
  height: 32px;
  font: 22px/1 var(--serif);
  padding: 0;
}
.cal-nav:disabled {
  opacity: .25;
  cursor: default;
}
.cal-period {
  min-height: 32px;
  font: 16px/1.3 var(--serif);
  padding: 3px 0;
  letter-spacing: .04em;
}
.cal-period[aria-pressed=true] {
  background: #e4e8d5;
  border-color: #b3bf99;
}
.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  margin-bottom: 5px;
  border-bottom: 1px solid #d3d3bd;
  padding-bottom: 8px;
  color: #788466;
  font: 11px/1.5 var(--ui);
  text-align: center;
  letter-spacing: 0;
}
.cal-days {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  gap: 3px;
}
.calendar .cal-day {
  height: 32px;
  padding: 0;
  font: 16px/1 var(--serif);
  font-variant-numeric: tabular-nums;
}
.calendar .cal-day.today {
  border-color: #b39a62;
  color: #785e32;
}
.calendar .selected,
.calendar .selected:hover {
  background: #52674d;
  color: #fff9e8;
  border-color: #52674d;
}
.cal-options {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 7px;
  min-height: 196px;
  align-content: center;
}
.calendar .cal-option {
  min-height: 40px;
  padding: 5px 2px;
  font: 15px/1.4 var(--serif);
}
.cal-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
  border-top: 1px solid #d3d3bd;
  margin-top: 13px;
  padding-top: 8px;
}
.cal-footer button {
  min-height: 34px;
  padding: 5px 8px;
  font: 12px/1.4 var(--ui);
  color: #59684e;
}
.cal-footer button:last-child {
  color: #7a7f6d;
}
.calendar span {
  margin: 0;
}
.summary {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: .07em;
  line-height: 1.7;
}
.brand-subtitle {
  font-family: "FangSong","STFangsong","仿宋",var(--serif);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: .14em;
  color: #657156;
  margin-left: 9px;
}
.task .check-area {
  position: relative;
  flex: 0 0 46px;
  min-height: 54px;
  gap: 2px;
}
.completion-label {
  font: 11px/1.3 var(--ui);
  color: #687858;
  letter-spacing: .06em;
  white-space: nowrap;
}
.task.done .completion-label { color: #7a806d; }
.task input[type=checkbox] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  margin: 0;
  z-index: 1;
}
.task-flower {
  width: 46px;
  height: 52px;
  overflow: visible;
  pointer-events: none;
}
.task input[type=checkbox]:focus-visible+.task-flower {
  outline: 2px solid #8d9b72;
  outline-offset: 1px;
  border-radius: 7px;
}
.flower-stem {
  fill: #d3ddbd;
  stroke: #687e52;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.bloom-petal {
  fill: #ebddc1;
  stroke: #9b8258;
  stroke-width: 1.3;
  transform: scale(.16,.58);
  opacity: 0;
  transition: transform 1.6s cubic-bezier(.25,.65,.3,1), opacity .7s ease;
}
.petal-turn:nth-child(even) .bloom-petal {
  fill: #e3d1ad;
}
.flower-bud {
  fill: #cbd6b3;
  stroke: #71855a;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  transform-origin: 26px 32px;
  transition: opacity .8s ease, transform 1.3s cubic-bezier(.25,.65,.3,1);
}
.task.done .bloom-petal {
  transform: scale(1);
  opacity: 1;
}
.task.done .flower-bud {
  opacity: 0;
  transform: scale(.45);
}
.bloom-closing .bloom-petal {
  transition-duration: 1.1s, .6s;
}
.bloom-closing .flower-bud {
  transition-duration: .6s, 1.1s;
}
@media(max-width:760px) {
  .summary {
    font-size: 13px;
  }
  .task .check-area {
    flex-basis: 42px;
  }
  .task-flower {
    width: 42px;
    height: 48px;
  }
}
@media(max-width:400px) {
  .task-content {
    flex-basis: calc(100% - 50px);
  }
}
@media(prefers-reduced-motion:reduce) {
  .task-flower * {
    transition: none!important;
  }
}
.sheet-mark {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);
  width: 270px;
  height: 338px;
  color: #72815a;
  opacity: .1;
  pointer-events: none;
  z-index: -1;
}
.sheet.has-tasks .sheet-mark {
  display: block;
}
@media(max-width:760px) {
  .sheet-mark {
    width: 190px;
    height: 238px;
    opacity: .085;
  }
}
/* 每条任务独立选择心情，未选择时只显示一个轻量入口。 */
.mood-toggle { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 24px; padding: 0 0 4px; border: 0; background: transparent; color: #687858; font: 11px/20px var(--ui); letter-spacing: .025em; }
.mood-toggle:hover { color: var(--green); }
.mood-toggle[aria-expanded=true] { color: var(--green); text-decoration: underline; text-underline-offset: 4px; }
.mood-options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 9px; background: #eef0e1; border: 1px solid #c7cfb4; border-radius: 4px; }
.mood-option { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 34px; padding: 5px 9px; border: 1px solid transparent; background: transparent; color: #637151; font: 12px/1.5 var(--ui); }
.mood-option:hover { background: #e4e9d5; }
.mood-option[aria-pressed=true] { background: #dfe7cf; border-color: #9aaa7d; color: #405438; }
.mood-icon { display: inline-block; flex: 0 0 auto; width: 16px; height: 16px; overflow: visible; vertical-align: middle; }
.task-actions { position: relative; }
.row-mood-toggle { min-height: 44px; padding: 10px 8px; font-size: 12px; line-height: 1.5; white-space: nowrap; }
.row-mood-options { position: absolute; top: calc(100% + 4px); right: 0; z-index: 5; width: 280px; max-width: calc(100vw - 60px); margin: 0; background: var(--paper); border-color: #9aaa7d; box-shadow: 0 8px 22px #3442381c; }
.edit-mood { margin-top: 16px; }
.edit-mood .mood-toggle { font-size: 12px; min-height: 30px; }
@media(max-width:600px) { .task { flex-wrap: wrap; } .task-content { flex-basis: calc(100% - 50px); } .task-actions { margin-left: auto; margin-top: -6px; } }
@media(max-width:420px) { .mood-option { padding-left: 7px; padding-right: 7px; } .row-mood-toggle { padding-left: 7px; padding-right: 7px; } }
</style>

<script>
"use strict";
(() => {
  // 保留首版存储键，避免视觉改版造成原有任务无法读取。
  const STORAGE_KEY = "ke-jian.study-tasks.v1";
  const MOODS = Object.freeze([
    {value:"happy",label:"开心",face:"M7 14C9 18 15 18 17 14",eyes:"M7 9L9 9M15 9L17 9"},
    {value:"tired",label:"疲惫",face:"M9 16H15",eyes:"M6.5 10H10M14 10H17.5"},
    {value:"anxious",label:"焦虑",face:"M8 17C10 13 14 13 16 17",eyes:"M7 8L10 10M14 10L17 8"},
    {value:"calm",label:"平静",face:"M9 15C11 17 13 17 15 15",eyes:"M6.5 10C8 11 9 11 10.5 10M13.5 10C15 11 16 11 17.5 10"}
  ]);
  const moodFor = value => MOODS.find(mood => mood.value === value);
  const $ = id => document.getElementById(id);
  let tasks = [], hideCompleted = false, editingId = null, lastDay = "";
  const pendingDeletes = new Map();
  const bloomingTasks = new Map();
  const taskRows = new Map();
  let activeMoodId = null, moodPanelSerial = 0;
  let activeCalendar = null;

  // 输入法回车只确认选字，下一次普通回车才提交表单。
  for(const id of ["task-form", "edit-form"]) {
    const form = $(id);
    let composing = false;
    form.addEventListener("compositionstart", () => {composing = true;});
    form.addEventListener("compositionend", () => {composing = false;});
    form.addEventListener("keydown", e => {
      if(e.key === "Enter" && (composing || e.isComposing || e.keyCode === 229)) e.preventDefault();
    });
    form.addEventListener("submit", e => {
      if(composing) {e.preventDefault(); e.stopImmediatePropagation();}
    });
  }

  function localDate() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function validDate(s) {
    if(s === "") return true;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(s) || s < "0001-01-01") return false;
    const d = new Date(`${s}T12:00:00`);
    return !Number.isNaN(d.getTime()) && `${String(d.getFullYear()).padStart(4,"0")}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}` === s;
  }
  function warning(message) {
    $("storage-warning").textContent = message;
    $("storage-warning").hidden = false;
  }
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw !== null) {
      const data = JSON.parse(raw), ids = new Set();

    if(overdue) {const span = document.createElement("span"); span.className = "overdue-summary"; span.textContent = ` · ${overdue} 项逾期`; $("summary").append(span);}
    $("toggle-completed").hidden = !done;
    $("toggle-completed").textContent = hideCompleted ? "显示已完成" : "隐藏已完成";
    $("toggle-completed").setAttribute("aria-pressed", String(hideCompleted));
    // 绽放期间保留原来的排序位置，避免花尚未展开就移到列表末尾或被隐藏。
    const sortDone = task => bloomingTasks.get(task.id)?.from ?? task.done;
    const visible = tasks.filter(t => !hideCompleted || !t.done || bloomingTasks.get(t.id)?.to).sort((a,b) => Number(sortDone(a))-Number(sortDone(b)) || (a.date || "9999-99-99").localeCompare(b.date || "9999-99-99") || a.created-b.created);
    // 复用任务行与花朵，只移动排序真正变化的行，保留浏览器正在进行的过渡。
    const list = $("task-list"), existingIds = new Set(tasks.map(task => task.id));
    for(const [id,row] of taskRows) {
      if(!existingIds.has(id)) {row.li.remove(); taskRows.delete(id);}
    }
    const visibleIds = new Set(visible.map(task => task.id));
    if(activeMoodId && !visibleIds.has(activeMoodId)) closeRowMood();
    for(const li of Array.from(list.children)) if(!visibleIds.has(li.dataset.id)) li.remove();
    visible.forEach((task,index) => {
      const li = updateTaskRow(task,today), current = list.children[index];
      if(current !== li) list.insertBefore(li,current || null);
    });
    $("empty").hidden = visible.length > 0;
    $("empty-title").textContent = tasks.length === 0 ? "从一件小事开始" : "待办已完成";
    $("empty-text").textContent = tasks.length === 0 ? "写下任务后，轻点花苞即可完成。" : "可以记下新的安排，或点击“显示已完成”查看记录。";
  }
  $("task-form").addEventListener("submit", e => {
    e.preventDefault();
    const error = validate($("task-name"), $("task-date"));
    if(error) {feedback(error, true); ($("task-name").value.trim() && $("task-name").value.trim().length <= 100 ? $("task-date-trigger") : $("task-name")).focus(); return;}
    tasks.push({id:globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`, title:$("task-name").value.trim(), date:$("task-date").value, mood:"", done:false, created:Date.now()});
    save(); render(); $("task-form").reset(); syncDateDisplays(); $("task-name").focus(); feedback("已添加任务。");
  });
  $("toggle-completed").addEventListener("click", () => {hideCompleted = !hideCompleted; render();});
  $("undo").addEventListener("click", () => {
    const entry = Array.from(pendingDeletes.entries()).pop();
    if(!entry) return;
    const [id, {task, timer}] = entry;
    clearTimeout(timer); pendingDeletes.delete(id);
    if(!tasks.some(t => t.id === id)) tasks.push(task);
    save(); render(); syncUndoBar(); feedback("已恢复任务。");
    if(pendingDeletes.size) $("undo").focus(); else $("task-name").focus();
  });
  $("edit-form").addEventListener("submit", e => {
    e.preventDefault();
    const error = validate($("edit-name"), $("edit-date"));
    if(error) {$("edit-error").textContent = error; $("edit-error").hidden = false; return;}
    const task = tasks.find(t => t.id === editingId);
    if(!task) {$("edit-dialog").close(); return;}
    task.title = $("edit-name").value.trim(); task.date = $("edit-date").value; task.mood = moodFor($("edit-mood").value)?.value || "";
    save(); render(); $("edit-dialog").close(); focusTask(task.id, "button"); feedback("已保存修改。");
  });
  $("edit-cancel").addEventListener("click", () => $("edit-dialog").close());
  $("edit-dialog").addEventListener("close", () => {focusTask(editingId, "button"); editingId = null;});
  // 只在跨日时刷新列表，避免定时重建打断键盘操作。
  function refreshDay() {if(localDate() !== lastDay) render();}
  window.addEventListener("focus", refreshDay); setInterval(refreshDay, 60000); render();
})();
</script>
</body>
</html>
